name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]  # EOLまで6ヶ月以上あるバージョン
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # プライベートパッケージ（pyproject.toml に https://github.com/[username]/python-* を含む場合）:
      # Repository secrets に GH_TOKEN（PAT の値）を登録したうえで以下のステップを追加してください。
      # PAT はソースにコミットせず secrets 経由で注入します。
      # 詳細: README-jp.md「プライベートパッケージの PAT 設定」
      #
      # - name: pyproject.toml の git URL に PAT を注入（CI のみ・コミットされない）
      #   run: |
      #     sed -i \
      #       "s|https://github.com/[username]/python-|https://${{ secrets.GH_TOKEN }}@github.com/[username]/python-|g" \
      #       pyproject.toml
      - run: uv sync --frozen
      - run: uv run pytest

  build:
    name: Build
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv build
